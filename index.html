<!doctype html>
<html lang="en">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8HNVQE69CC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Safe default first
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });

      // Re-apply stored choice immediately (returning users)
      try {
        const saved = localStorage.getItem('cookie_consent');
        if (saved === 'accepted' || saved === 'rejected') {
          gtag('consent', 'update', {
            analytics_storage: saved === 'accepted' ? 'granted' : 'denied'
          });
        }
      } catch (_) { /* localStorage unavailable — stay denied */ }

      // Now load GA, knowing the correct consent state
      gtag('js', new Date());
      gtag('config', 'G-8HNVQE69CC');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chris Bicknell - IAM Specialist</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
